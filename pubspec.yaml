name: restaurant_pos
description: Offline-first restaurant point of sale for Android and Windows.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/restoram_logo.jpg

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/branding/restoram_logo.jpg
    icon_size: 256
  image_path: assets/branding/restoram_logo.jpg
  min_sdk_android: 21