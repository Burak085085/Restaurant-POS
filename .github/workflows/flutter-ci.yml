name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: restaurant-pos-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Windows runners
        run: flutter create --platforms=android,windows --project-name restaurant_pos .
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name restaurant_pos .
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error