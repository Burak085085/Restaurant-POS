name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: restaurant-pos-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android and Windows runners
        run: flutter create --platforms=android,windows --project-name restaurant_pos .
      - name: Set Android compile SDK for current plugins
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle.kts'); s=p.read_text(); old='compileSdk = flutter.compileSdkVersion'; assert old in s, 'Generated compileSdk setting not found'; p.write_text(s.replace(old, 'compileSdk = 36', 1))"
      - name: Configure release signing (optional owner keystore)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_android_signing.py
      - run: flutter pub get
      - name: Generate branded app icons
        run: dart run flutter_launcher_icons
      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
      - name: Report analyze result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter analyze (Android job)" analyze.log
      - name: Flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee test.log
      - name: Report test result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter test (Android job)" test.log
      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-pub --build-number=$((100 + GITHUB_RUN_NUMBER)) 2>&1 | tee build.log
      - name: Report build result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter build apk" build.log
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name restaurant_pos .
      - run: flutter pub get
      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
      - name: Report analyze result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter analyze (Windows job)" analyze.log
      - name: Flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee test.log
      - name: Report test result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter test (Windows job)" test.log
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --no-pub 2>&1 | tee build.log
      - name: Report build result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter build windows" build.log
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
