name: Flutter CI
on:
  push:
    branches: [main, 'migrate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: restaurant-pos-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  FLUTTER_VERSION: "3.50.0"
jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name restaurant_pos .
      - run: flutter pub get
      - name: Dart fix dry run (informational)
        shell: bash
        run: |
          set -o pipefail
          dart fix --dry-run 2>&1 | tee dartfix.log
      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
      - name: Report analyze result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter analyze (Android job)" analyze.log
      - name: Flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee test.log
      - name: Report test result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter test (Android job)" test.log
      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee build.log
      - name: Report build result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter build apk" build.log
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish CI report to the ci-reports branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish.sh android
  windows:
    name: Analyze, test and build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name restaurant_pos .
      - run: flutter pub get
      - name: Dart fix dry run (informational)
        shell: bash
        run: |
          set -o pipefail
          dart fix --dry-run 2>&1 | tee dartfix.log
      - name: Flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
      - name: Report analyze result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter analyze (Windows job)" analyze.log
      - name: Flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee test.log
      - name: Report test result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter test (Windows job)" test.log
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --no-pub 2>&1 | tee build.log
      - name: Report build result
        if: always()
        shell: bash
        run: bash .github/scripts/report.sh "flutter build windows" build.log
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
      - name: Publish CI report to the ci-reports branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish.sh windows
