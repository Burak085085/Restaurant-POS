<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Restaurant POS</title>
<style>
:root{--bg:#eef1f4;--ink:#1b2733;--mute:#66758a;--card:#fff;--line:#d5dce4;--free:#2e9e6b;--busy:#d8453a;--bill:#e39a1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);user-select:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff}header h1{font-size:18px;margin:0;flex:1}header .stat{font-size:13px;opacity:.85}header button{background:#ffffff22;color:#fff;padding:8px 14px;border-radius:8px;font-weight:600}
.tables{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}.table{background:var(--card);border-radius:14px;padding:14px;text-align:left;border-left:8px solid var(--free);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px #0002}.table.busy{border-color:var(--busy)}.table.bill{border-color:var(--bill)}.table b{font-size:18px}.table small{color:var(--mute)}.table .sum{font-size:20px;font-weight:700}
.legend{display:flex;gap:14px;padding:10px 16px 0;font-size:13px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.order{flex:1;display:flex;min-height:0}.menu{flex:1.4;display:flex;flex-direction:column;min-width:0}.cats{display:flex;gap:8px;padding:12px;overflow-x:auto}.cats button{background:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.products{flex:1;overflow:auto;padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}.prod{background:var(--card);border-radius:12px;padding:14px 10px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 1px 2px #0002}.prod:active{transform:scale(.97)}.prod span{color:var(--mute);font-weight:600}
.ticket{flex:1;max-width:400px;min-width:280px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}.ticket h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;padding:4px 10px;border-radius:999px;color:#fff;background:var(--free)}.badge.busy{background:var(--busy)}.badge.bill{background:var(--bill)}
.lines{flex:1;overflow:auto;padding:6px 12px}.empty{color:var(--mute);padding:24px 8px;text-align:center}.line{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}.line.rep{background:#fff4d6;border-radius:8px}.line .n{flex:1;min-width:0}.line .n small{display:block;color:var(--mute)}.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border-radius:8px;background:var(--bg);font-size:18px;font-weight:700}.qty b{min-width:20px;text-align:center}.line .t{width:62px;text-align:right;font-weight:700}.line .x{background:none;font-size:16px;padding:6px}
.foot{padding:12px 16px;border-top:1px solid var(--line)}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-bottom:10px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns button{padding:14px;border-radius:10px;font-weight:700;background:var(--bg)}.btns .pay{background:var(--free);color:#fff;grid-column:1/-1}.btns .ask{background:var(--bill);color:#fff}.btns .clr{color:var(--busy)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}.box{background:var(--card);border-radius:16px;width:100%;max-width:380px;max-height:100%;overflow:auto;padding:16px}.box h3{margin:0 0 10px;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:6px 0}.row .in{font-size:26px}.change{margin:8px 0;padding:12px;border-radius:12px;text-align:center;font-size:24px;font-weight:800;background:var(--bg);color:var(--mute)}.change.ok{background:#dff3e8;color:#14774a}.change.bad{background:#fbe1de;color:#b3271d}.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.nums button{padding:16px 0;border-radius:10px;background:var(--bg);font-weight:700;font-size:18px}.nums .all{grid-column:1/-1;background:var(--ink);color:#fff}.quick,.pad{display:grid;gap:8px;margin-top:8px}.quick{grid-template-columns:repeat(6,1fr)}.pad{grid-template-columns:repeat(3,1fr)}.quick button,.pad button{padding:14px 0;border-radius:10px;background:var(--bg);font-weight:700;font-size:18px}.quick .exact{background:var(--ink);color:#fff;font-size:14px}.acts{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:12px}.acts button{padding:14px;border-radius:10px;font-weight:700;background:var(--bg)}.acts .go{background:var(--free);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}.hint{background:#fff4d6;padding:8px 12px;font-size:13px;text-align:center}@media(max-width:760px){.order{flex-direction:column}.ticket{max-width:none;border-left:0;border-top:1px solid var(--line);flex:1.1}.menu{flex:1}}
</style></head><body><div id="app"></div><script>
"use strict";
const TABLE_COUNT=20,STORE_KEY="restaurant_pos_v1";
const MENU=[{id:"d1",cat:"Dönerler",name:"Tavuk döner",price:300},{id:"d2",cat:"Dönerler",name:"Dana döner",price:500},{id:"d3",cat:"Dönerler",name:"Dürüm döner",price:400},{id:"d4",cat:"Dönerler",name:"Porsiyon döner",price:700},{id:"i1",cat:"İçecekler",name:"Kola",price:200},{id:"i2",cat:"İçecekler",name:"Fanta",price:200},{id:"i3",cat:"İçecekler",name:"Ayran",price:100},{id:"i4",cat:"İçecekler",name:"Su",price:50},{id:"e1",cat:"Ekstra",name:"Patates",price:200},{id:"e2",cat:"Ekstra",name:"Ketçap",price:50},{id:"e3",cat:"Ekstra",name:"Mayonez",price:50}];
const CATS=[...new Set(MENU.map(m=>m.cat))],STATUS_TXT={empty:"Boş",busy:"Dolu",bill:"Hesap istendi"};
let state=load();const ui={view:"tables",table:null,cat:CATS[0],rep:null,repQty:null,pay:null};
function freshState(){return{tables:Array.from({length:TABLE_COUNT},(_,i)=>({id:i+1,status:"empty",items:[]})),sales:[]}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s&&Array.isArray(s.tables)){while(s.tables.length<TABLE_COUNT)s.tables.push({id:s.tables.length+1,status:"empty",items:[]});s.sales=Array.isArray(s.sales)?s.sales:[];return s}}catch(e){}return freshState()}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){console.error("Kayıt başarısız:",e)}}
const $=id=>document.getElementById(id),money=k=>(k/100).toFixed(2).replace(".",",").replace(",00","")+" ₼",total=t=>t.items.reduce((s,i)=>s+i.price*i.qty,0),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),cur=()=>state.tables[ui.table-1];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const todaySales=()=>state.sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.total,0);
function addProduct(pid){const p=MENU.find(m=>m.id===pid),t=cur();if(!p||!t)return;if(ui.rep){const idx=ui.rep.i,line=t.items[idx];if(line){const n=Math.min(ui.rep.n,line.qty);line.qty-=n;let at=idx+1;if(line.qty<=0){t.items.splice(idx,1);at=idx}const same=t.items.find(i=>i.pid===pid);if(same)same.qty+=n;else t.items.splice(at,0,{pid,name:p.name,price:p.price,qty:n})}ui.rep=null}else{const same=t.items.find(i=>i.pid===pid);if(same)same.qty++;else t.items.push({pid,name:p.name,price:p.price,qty:1})}if(t.status==="empty"||t.status==="bill")t.status="busy"}
function changeQty(i,d){const t=cur(),it=t.items[i];if(!it)return;it.qty+=d;if(it.qty<=0)t.items.splice(i,1);afterEdit(t)}
function removeLine(i){const t=cur();t.items.splice(i,1);afterEdit(t)}
function afterEdit(t){ui.rep=null;ui.repQty=null;if(!t.items.length)t.status="empty"}
function parseMoney(str){if(!str)return 0;const n=parseFloat(str.replace(",","."));return isNaN(n)?0:Math.round(n*100)}
function fmtInput(k){return(k/100).toFixed(2).replace(".",",").replace(",00","")}
function openPay(){if(cur().items.length){ui.rep=null;ui.repQty=null;ui.pay={s:""}}}
function padKey(k){let s=ui.pay.s;if(k==="del")s=s.slice(0,-1);else if(k===","){if(!s)s="0,";else if(!s.includes(","))s+=","}else{if(s==="0")s=k;else if(s.length<8&&!(s.includes(",")&&s.split(",")[1].length>=2))s+=k}ui.pay.s=s}
function finishPay(){const t=cur(),tot=total(t),given=parseMoney(ui.pay.s);if(!t.items.length||given<tot)return;state.sales.push({date:today(),time:new Date().toISOString(),table:t.id,total:tot,paid:given,change:given-tot,items:t.items.map(i=>({...i}))});t.items=[];t.status="empty";ui.view="tables";ui.rep=null;ui.repQty=null;ui.pay=null}
function clearTable(){const t=cur();if(t.items.length&&!confirm("Masa "+t.id+" siparişi silinsin mi? (Satış olarak kaydedilmez)"))return;t.items=[];t.status="empty";ui.view="tables";ui.rep=null;ui.repQty=null;ui.pay=null}
function renderTables(){const busy=state.tables.filter(t=>t.status!=="empty").length;$("app").innerHTML=`
<header><h1>Restaurant POS</h1><span class="stat">Dolu: ${busy}/${TABLE_COUNT} · Bugün: ${money(todaySales())}</span></header>
<div class="legend"><span><i style="background:var(--free)"></i>Boş</span><span><i style="background:var(--busy)"></i>Dolu</span><span><i style="background:var(--bill)"></i>Hesap istendi</span></div>
<div class="tables">${state.tables.map(t=>`<button class="table ${t.status}" data-a="open" data-id="${t.id}"><div><b>Masa ${t.id}</b><br><small>${STATUS_TXT[t.status]||"Boş"}</small></div><div class="sum">${money(total(t))}</div></button>`).join("")}</div>`}
function renderOrder(){const t=cur(),items=t.items,prods=MENU.filter(m=>m.cat===ui.cat);$("app").innerHTML=`
<header><button data-a="back">‹ Masalar</button><h1>Masa ${t.id}</h1></header>
${ui.rep&&t.items[ui.rep.i]?`<div class="hint">${ui.rep.n} adet ${esc(t.items[ui.rep.i].name)} yerine yeni ürünü seçin</div>`:""}
<div class="order"><section class="menu"><div class="cats">${CATS.map(c=>`<button class="${c===ui.cat?"on":""}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
<div class="products">${prods.map(p=>`<button class="prod" data-a="add" data-id="${p.id}"><div>${esc(p.name)}</div><span>${money(p.price)}</span></button>`).join("")}</div></section>
<aside class="ticket"><h2>Sipariş <span class="badge ${t.status}">${STATUS_TXT[t.status]}</span></h2>
<div class="lines">${items.length?items.map((it,i)=>`<div class="line ${ui.rep&&ui.rep.i===i?"rep":""}"><div class="n">${esc(it.name)}<small>${money(it.price)}</small></div><div class="qty"><button data-a="dec" data-i="${i}">−</button><b>${it.qty}</b><button data-a="inc" data-i="${i}">+</button></div><div class="t">${money(it.price*it.qty)}</div><button class="x" data-a="rep" data-i="${i}" title="Değiştir">⇄</button><button class="x" data-a="del" data-i="${i}" title="Sil">✕</button></div>`).join(""):'<div class="empty">Henüz ürün yok.<br>Soldan ürün seçin.</div>'}</div>
<div class="foot"><div class="total"><span>TOPLAM</span><span>${money(total(t))}</span></div><div class="btns"><button class="ask" data-a="ask" ${items.length?"":"disabled"}>Hesap iste</button><button class="clr" data-a="clear">Masayı boşalt</button><button class="pay" data-a="close" ${items.length?"":"disabled"}>Hesabı kapat</button></div></div></aside></div>${ui.pay?payModal(t):""}${ui.repQty!==null?repModal(t):""}`}
function repModal(t){const it=t.items[ui.repQty];if(!it)return"";const max=Math.min(it.qty-1,11),nums=Array.from({length:max},(_,k)=>k+1);return`<div class="modal"><div class="box"><h3>Kaç adet ${esc(it.name)} değişsin?</h3><div class="nums">${nums.map(n=>`<button data-a="repn" data-n="${n}">${n}</button>`).join("")}<button class="all" data-a="repn" data-n="${it.qty}">Hepsi (${it.qty})</button></div><div class="acts" style="grid-template-columns:1fr"><button data-a="repcancel">Vazgeç</button></div></div></div>`}
function payModal(t){const tot=total(t),given=parseMoney(ui.pay.s),diff=given-tot,has=ui.pay.s!=="",cls=!has?"":diff>=0?"ok":"bad",txt=!has?"Alınan parayı girin":diff>=0?"Para üstü: "+money(diff):"Eksik: "+money(-diff);return`<div class="modal"><div class="box"><h3>Masa ${t.id} · Ödeme</h3><div class="row"><span>Hesap</span><b>${money(tot)}</b></div><div class="row"><span>Alınan</span><b class="in">${esc(ui.pay.s||"0")} ₼</b></div><div class="change ${cls}">${txt}</div><div class="quick">${[5,10,20,50,100].map(v=>`<button data-a="quick" data-v="${v}">${v}</button>`).join("")}<button class="exact" data-a="exact">Tam</button></div><div class="pad">${["1","2","3","4","5","6","7","8","9",",","0","del"].map(k=>`<button data-a="pad" data-k="${k}">${k==="del"?"⌫":k}</button>`).join("")}</div><div class="acts"><button data-a="paycancel">Vazgeç</button><button class="go" data-a="paydone" ${has&&diff>=0?"":"disabled"}>Hesabı kapat</button></div></div></div>`}
function render(){ui.view==="tables"?renderTables():renderOrder();save()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;
if(a==="open"){ui.table=+b.dataset.id;ui.view="order";ui.rep=null;ui.repQty=null;ui.pay=null;ui.cat=CATS[0]}
else if(a==="back"){ui.view="tables";ui.rep=null;ui.repQty=null;ui.pay=null}
else if(a==="cat")ui.cat=b.dataset.c;else if(a==="add")addProduct(b.dataset.id);else if(a==="inc")changeQty(i,1);else if(a==="dec")changeQty(i,-1);else if(a==="del")removeLine(i);
else if(a==="rep"){const line=cur().items[i];if(ui.rep&&ui.rep.i===i)ui.rep=null;else if(line&&line.qty===1)ui.rep={i,n:1};else if(line)ui.repQty=i}
else if(a==="repn"){ui.rep={i:ui.repQty,n:+b.dataset.n};ui.repQty=null}else if(a==="repcancel")ui.repQty=null;else if(a==="ask")cur().status="bill";else if(a==="close")openPay();else if(a==="pad")padKey(b.dataset.k);else if(a==="quick")ui.pay.s=b.dataset.v;else if(a==="exact")ui.pay.s=fmtInput(total(cur()));else if(a==="paycancel")ui.pay=null;else if(a==="paydone")finishPay();else if(a==="clear")clearTable();render()});
render();
</script></body></html>
